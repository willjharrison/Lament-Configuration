<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Lament Configuration — Cross-Modal Manifold</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #050507;
      font-family: "Courier New", Courier, monospace;
      color: #d4af37;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
    }
    /* HUD Panel */
    #hud {
      position: absolute;
      top: 24px;
      left: 24px;
      pointer-events: none;
      background: rgba(10, 8, 12, 0.85);
      border: 1px solid #b8860b;
      box-shadow: 0 0 15px rgba(184, 134, 11, 0.2);
      padding: 16px;
      border-radius: 2px;
      max-width: 320px;
      z-index: 10;
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #f3e5ab;
      border-bottom: 1px solid rgba(184, 134, 11, 0.4);
      padding-bottom: 6px;
    }
    p {
      margin: 6px 0 0 0;
      font-size: 0.75rem;
      color: #a89f91;
      line-height: 1.4;
    }
    /* Tooltip / Mechanism Card */
    #tooltip {
      position: absolute;
      display: none;
      pointer-events: none;
      background: rgba(8, 6, 10, 0.95);
      border: 1px solid #d4af37;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
      padding: 12px;
      border-radius: 2px;
      max-width: 300px;
      z-index: 20;
    }
    #tooltip img {
      width: 100%;
      height: auto;
      max-height: 160px;
      object-fit: cover;
      border: 1px solid rgba(212, 175, 55, 0.5);
      margin-bottom: 8px;
      display: block;
      filter: sepia(0.15) contrast(1.1);
    }
    #tooltip .meta {
      font-size: 0.7rem;
      color: #d4af37;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    #tooltip .caption {
      font-size: 0.75rem;
      color: #cccccc;
      line-height: 1.35;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* Controls Overlay */
    #controls-guide {
      position: absolute;
      bottom: 24px;
      left: 24px;
      font-size: 0.7rem;
      color: #776e62;
      pointer-events: none;
      z-index: 10;
    }
  </style>
  <!-- Three.js, OrbitControls, and CSS2DRenderer -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="hud">
    <h1>Lament Configuration</h1>
    <p>Manifold Architecture: Visual Statistics ⟷ IMDB Semantic Geometry</p>
  </div>

  <div id="tooltip">
    <img id="tt-img" src="" alt="Frame Cut" />
    <div id="tt-meta" class="meta"></div>
    <div id="tt-caption" class="caption"></div>
  </div>

  <div id="controls-guide">
    [DRAG] Rotate Alignment Space | [SCROLL] Zoom Manifold
  </div>

  <script>
    let scene, camera, renderer, labelRenderer, controls;
    let pointCloud, raycaster, mouse;
    let pointsData = [];
    
    const tooltip = document.getElementById('tooltip');
    const ttImg = document.getElementById('tt-img');
    const ttMeta = document.getElementById('tt-meta');
    const ttCaption = document.getElementById('tt-caption');

    init();

    function init() {
      // 1. World Setup
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x050507, 0.008);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 10, 50);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      // CSS2D Label Renderer
      labelRenderer = new THREE.CSS2DRenderer();
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.domElement.style.position = 'absolute';
      labelRenderer.domElement.style.top = '0px';
      labelRenderer.domElement.style.pointerEvents = 'none';
      document.body.appendChild(labelRenderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.04;

      raycaster = new THREE.Raycaster();
      raycaster.params.Points.threshold = 0.8;
      mouse = new THREE.Vector2(-100, -100);

      // Add brass ambient light & grid mechanism
      const ambientLight = new THREE.AmbientLight(0xd4af37, 0.5);
      scene.add(ambientLight);

      const gridHelper = new THREE.GridHelper(100, 40, 0xb8860b, 0x221a0f);
      gridHelper.position.y = -22;
      scene.add(gridHelper);

      // 2. Load Manifold Data
      fetch('./rosetta_manifold_data.json')
        .then(res => {
          if (!res.ok) throw new Error(`HTTP error! Status: ${res.status}`);
          return res.json();
        })
        .then(data => {
          console.log("Raw JSON structure loaded:", data);
          buildLamentManifold(data);
        })
        .catch(err => console.error("Error unspooling manifold geometry:", err));

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('mousemove', onMouseMove);

      animate();
    }

    function createCSSLabel(text, color, isBold, bgAlpha = 0.75) {
      const div = document.createElement('div');
      div.className = 'label';
      div.textContent = text;
      div.style.color = color || '#f3e5ab';
      div.style.fontFamily = '"Courier New", Courier, monospace';
      div.style.fontSize = isBold ? '11px' : '9px';
      div.style.fontWeight = isBold ? 'bold' : 'normal';
      div.style.padding = '3px 6px';
      div.style.background = `rgba(5, 5, 7, ${bgAlpha})`;
      div.style.border = `1px solid ${color || '#b8860b'}`;
      div.style.borderRadius = '2px';
      div.style.letterSpacing = '0.05em';
      div.style.whiteSpace = 'nowrap';
      div.style.textShadow = '0 0 5px rgba(0,0,0,0.9)';
      return new THREE.CSS2DObject(div);
    }

    function getImgSource(node) {
      if (!node) return '';
      let src = node.img_base64 || node.frame_base64 || node.image_base64 || node.thumbnail || node.image || node.img || '';
      if (src && !src.startsWith('data:') && !src.startsWith('http')) {
        src = 'data:image/jpeg;base64,' + src;
      }
      return src;
    }

    function getTextSnippet(node) {
      if (!node) return '';
      return node.text_snippet || node.review_snippet || node.review_text || node.text || node.snippet || node.caption || node.review || '';
    }

    function extractPointsArray(rawData) {
      if (Array.isArray(rawData)) return rawData;
      if (!rawData || typeof rawData !== 'object') return [];

      if (Array.isArray(rawData.movies)) {
        let allScenes = [];
        rawData.movies.forEach(movie => {
          const scenes = movie.scenes || movie.frames || movie.trajectory || movie.points || [];
          if (Array.isArray(scenes) && scenes.length > 0) {
            scenes.forEach(sc => {
              allScenes.push({
                ...sc,
                movie_title: movie.title || movie.name || 'Unknown Movie'
              });
            });
          }
        });

        if (allScenes.length > 0) return allScenes;
      }

      const candidateKeys = ['scenes', 'points', 'nodes', 'data', 'features', 'samples', 'vectors', 'manifold', 'movies'];
      for (const key of candidateKeys) {
        if (Array.isArray(rawData[key])) return rawData[key];
      }

      return [];
    }

    function extractCoordinates(item) {
      if (!item) return [0, 0, 0];
      if (Array.isArray(item) && item.length >= 3) return item.slice(0, 3);
      
      const coords = item.coords_3d || item.coords || item.centroid_3d || item.centroid || item.position || item.vector || item.xyz;
      if (Array.isArray(coords) && coords.length >= 3) return coords;

      if ('x' in item && 'y' in item && 'z' in item) {
        return [item.x, item.y, item.z];
      }

      return [0, 0, 0];
    }

    function buildLamentManifold(data) {
      pointsData = extractPointsArray(data);
      const count = pointsData.length;

      if (count === 0) {
        console.warn("Could not find manifold data points in rosetta_manifold_data.json.");
        return;
      }

      console.log(`Parsed ${count} manifold nodes.`);

      // 1. Calculate Bounding Normalization
      let minX = Infinity, maxX = -Infinity;
      let minY = Infinity, maxY = -Infinity;
      let minZ = Infinity, maxZ = -Infinity;

      pointsData.forEach(item => {
        const [x, y, z] = extractCoordinates(item);
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
        if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
      });

      const spanX = (maxX - minX) || 1;
      const spanY = (maxY - minY) || 1;
      const spanZ = (maxZ - minZ) || 1;
      const maxSpan = Math.max(spanX, spanY, spanZ);

      const targetExtent = 40.0;
      const scaleFactor = targetExtent / maxSpan;

      const centerX = (minX + maxX) / 2;
      const centerY = (minY + maxY) / 2;
      const centerZ = (minZ + maxZ) / 2;

      const transformCoord = (raw) => [
        (raw[0] - centerX) * scaleFactor,
        (raw[1] - centerY) * scaleFactor,
        (raw[2] - centerZ) * scaleFactor
      ];

      // 2. Build Point Cloud
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);

      const baseGold = new THREE.Color(0xd4af37);
      const darkBronze = new THREE.Color(0x8b5a2b);
      const highlightGold = new THREE.Color(0xffe893);

      pointsData.forEach((item, i) => {
        const rawCoords = extractCoordinates(item);
        const [x, y, z] = transformCoord(rawCoords);
        
        positions[i * 3]     = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        const norm = Math.min(Math.max((x + 20) / 40, 0), 1);
        const nodeColor = baseGold.clone().lerp(norm > 0.5 ? highlightGold : darkBronze, Math.abs(norm - 0.5) * 2);

        colors[i * 3]     = nodeColor.r;
        colors[i * 3 + 1] = nodeColor.g;
        colors[i * 3 + 2] = nodeColor.b;
      });

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const pMaterial = new THREE.PointsMaterial({
        size: 0.8,
        vertexColors: true,
        transparent: true,
        opacity: 0.85,
        sizeAttenuation: true
      });

      pointCloud = new THREE.Points(geometry, pMaterial);
      scene.add(pointCloud);

      // 3. Render Movie Titles & Textual Reviews around Movie Centroids
      if (Array.isArray(data.movies)) {
        data.movies.forEach(movie => {
          const rawPos = extractCoordinates(movie);
          const pos = transformCoord(rawPos);
          const title = movie.title || movie.name;
          
          if (title) {
            // Main Movie Title Tag
            const movieLabel = createCSSLabel(`🎬 ${title}`, '#f3e5ab', true, 0.85);
            movieLabel.position.set(pos[0], pos[1] + 1.8, pos[2]);
            scene.add(movieLabel);

            // Floating Textual Review Snippets tied to movie cluster
            const scenes = movie.scenes || movie.frames || movie.trajectory || [];
            if (Array.isArray(scenes) && scenes.length > 0) {
              // Pick 2 representative scenes per movie to anchor in 3D space
              const sampleIndices = [0, Math.floor(scenes.length / 2)];
              sampleIndices.forEach((idx, offsetIdx) => {
                const sc = scenes[idx];
                const snippet = getTextSnippet(sc) || getTextSnippet(movie);
                if (snippet) {
                  const shortText = snippet.length > 45 ? snippet.substring(0, 45) + '…' : snippet;
                  const reviewCard = createCSSLabel(`" ${shortText} "`, '#d4af37', false, 0.65);
                  // Position near the centroid with an offset
                  reviewCard.position.set(pos[0] + (offsetIdx === 0 ? 3.5 : -3.5), pos[1] - (offsetIdx * 1.5 + 1.0), pos[2] + (offsetIdx * 2));
                  scene.add(reviewCard);
                }
              });
            }
          }
        });
      }

      // 4. Render Vocabulary Anchors in Space
      if (Array.isArray(data.vocabulary)) {
        data.vocabulary.forEach(vocab => {
          const rawPos = extractCoordinates(vocab);
          const pos = transformCoord(rawPos);
          const word = vocab.word || vocab.term || vocab.token;
          if (word) {
            const vocabLabel = createCSSLabel(`⟨ ${word} ⟩`, '#70b0ff', true, 0.7);
            vocabLabel.position.set(pos[0], pos[1], pos[2]);
            scene.add(vocabLabel);
          }
        });
      }

      // 5. Dimension Pole Labels along spatial axes
      const xPosLabel = createCSSLabel('X+ [High Luminance / Fast Motion]', '#f3e5ab', true);
      xPosLabel.position.set(22, -20, 0);
      scene.add(xPosLabel);

      const xNegLabel = createCSSLabel('X- [Low Spatial Frequency / Static]', '#a89f91', false);
      xNegLabel.position.set(-22, -20, 0);
      scene.add(xNegLabel);

      const yPosLabel = createCSSLabel('Y+ [High Spatial Complexity]', '#f3e5ab', true);
      yPosLabel.position.set(0, 22, 0);
      scene.add(yPosLabel);

      const zPosLabel = createCSSLabel('Z+ [Psychological / Visceral Text Embeddings]', '#70b0ff', true);
      zPosLabel.position.set(0, -20, 22);
      scene.add(zPosLabel);
    }

    function onMouseMove(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      tooltip.style.left = (event.clientX + 18) + 'px';
      tooltip.style.top = (event.clientY + 18) + 'px';
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      if (pointCloud && controls.state === -1) {
        pointCloud.rotation.y += 0.0005;
      }

      // Raycasting Hover Interaction
      if (pointCloud) {
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(pointCloud);

        if (intersects.length > 0) {
          const idx = intersects[0].index;
          const node = pointsData[idx];

          if (node) {
            const imgSrc = getImgSource(node);
            const snippet = getTextSnippet(node);

            tooltip.style.display = 'block';

            if (imgSrc) {
              ttImg.style.display = 'block';
              ttImg.src = imgSrc;
            } else {
              ttImg.style.display = 'none';
            }

            const title = node.movie_title || node.title || 'Scene Node';
            ttMeta.innerText = `${title} | Chamber: ${node.scene_id || node.scene_index || idx}`;
            ttCaption.innerText = snippet || 'No textual trace recorded for this node.';
          }
        } else {
          tooltip.style.display = 'none';
        }
      }

      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }
  </script>
</body>
</html>
