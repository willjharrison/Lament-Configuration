<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Lament Configuration — Cross-Modal Manifold</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #050507;
      font-family: "Courier New", Courier, monospace;
      color: #d4af37;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    /* HUD Panel */
    #hud {
      position: absolute;
      top: 24px;
      left: 24px;
      pointer-events: none;
      background: rgba(10, 8, 12, 0.85);
      border: 1px solid #b8860b;
      box-shadow: 0 0 15px rgba(184, 134, 11, 0.2);
      padding: 16px;
      border-radius: 2px;
      max-width: 320px;
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #f3e5ab;
      border-bottom: 1px solid rgba(184, 134, 11, 0.4);
      padding-bottom: 6px;
    }
    p {
      margin: 6px 0 0 0;
      font-size: 0.75rem;
      color: #a89f91;
      line-height: 1.4;
    }
    /* Tooltip / Mechanism Card */
    #tooltip {
      position: absolute;
      display: none;
      pointer-events: none;
      background: rgba(8, 6, 10, 0.92);
      border: 1px solid #d4af37;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
      padding: 12px;
      border-radius: 2px;
      max-width: 280px;
    }
    #tooltip img {
      width: 100%;
      height: auto;
      border: 1px solid rgba(212, 175, 55, 0.5);
      margin-bottom: 8px;
      display: block;
      filter: sepia(0.2) contrast(1.1);
    }
    #tooltip .meta {
      font-size: 0.7rem;
      color: #d4af37;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    #tooltip .caption {
      font-size: 0.75rem;
      color: #cccccc;
      line-height: 1.35;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* Controls Overlay */
    #controls-guide {
      position: absolute;
      bottom: 24px;
      left: 24px;
      font-size: 0.7rem;
      color: #776e62;
      pointer-events: none;
    }
  </style>
  <!-- Three.js and OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="hud">
    <h1>Lament Configuration</h1>
    <p>Manifold Architecture: Visual Statistics $\leftrightarrow$ IMDB Semantic Geometry</p>
  </div>

  <div id="tooltip">
    <img id="tt-img" src="" alt="Frame Cut" />
    <div id="tt-meta" class="meta"></div>
    <div id="tt-caption" class="caption"></div>
  </div>

  <div id="controls-guide">
    [DRAG] Rotate Alignment Space | [SCROLL] Zoom Manifold
  </div>

  <script>
    let scene, camera, renderer, controls;
    let pointCloud, raycaster, mouse;
    let pointsData = [];
    
    const tooltip = document.getElementById('tooltip');
    const ttImg = document.getElementById('tt-img');
    const ttMeta = document.getElementById('tt-meta');
    const ttCaption = document.getElementById('tt-caption');

    init();

    function init() {
      // 1. World Setup
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x050507, 0.012);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 55);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.04;

      raycaster = new THREE.Raycaster();
      raycaster.params.Points.threshold = 0.9;
      mouse = new THREE.Vector2(-100, -100);

      // Add brass ambient light & subtle grid mechanism
      const ambientLight = new THREE.AmbientLight(0xd4af37, 0.5);
      scene.add(ambientLight);

      const gridHelper = new THREE.GridHelper(100, 40, 0xb8860b, 0x221a0f);
      gridHelper.position.y = -25;
      scene.add(gridHelper);

      // 2. Load Manifold Data
      fetch('rosetta_manifold_data.json')
        .then(res => res.json())
        .then(data => {
          buildLamentManifold(data);
        })
        .catch(err => console.error("Error unspooling manifold geometry:", err));

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('mousemove', onMouseMove);

      animate();
    }

    function buildLamentManifold(data) {
      pointsData = data;
      const count = data.length;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);

      // Brass / Metallic Palette
      const baseGold = new THREE.Color(0xd4af37);
      const darkBronze = new THREE.Color(0x8b5a2b);
      const highlightGold = new THREE.Color(0xffe893);

      data.forEach((item, i) => {
        // Map 3D coordinates from JSON
        const [x, y, z] = item.coords_3d || [0, 0, 0];
        positions[i * 3]     = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        // Color gradient mapped across spatial placement
        const norm = Math.min(Math.max((x + 20) / 40, 0), 1);
        const nodeColor = baseGold.clone().lerp(norm > 0.5 ? highlightGold : darkBronze, Math.abs(norm - 0.5) * 2);

        colors[i * 3]     = nodeColor.r;
        colors[i * 3 + 1] = nodeColor.g;
        colors[i * 3 + 2] = nodeColor.b;
      });

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      // Particle Material
      const pMaterial = new THREE.PointsMaterial({
        size: 1.3,
        vertexColors: true,
        transparent: true,
        opacity: 0.9,
        sizeAttenuation: true
      });

      pointCloud = new THREE.Points(geometry, pMaterial);
      scene.add(pointCloud);
    }

    function onMouseMove(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      tooltip.style.left = (event.clientX + 18) + 'px';
      tooltip.style.top = (event.clientY + 18) + 'px';
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      // Slow idle rotation of the configuration box when not interacting
      if (pointCloud && !controls.state == -1) {
        pointCloud.rotation.y += 0.0005;
      }

      // Intersect Detection
      if (pointCloud) {
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(pointCloud);

        if (intersects.length > 0) {
          const idx = intersects[0].index;
          const node = pointsData[idx];

          if (node) {
            tooltip.style.display = 'block';
            ttImg.src = node.img_base64 || node.thumbnail || '';
            ttMeta.innerText = `Chamber: ${node.scene_id || idx} | Alignment: ${node.alignment_score ? node.alignment_score.toFixed(4) : 'Aligned'}`;
            ttCaption.innerText = node.text_snippet || node.review_text || 'No textual trace recorded.';
          }
        } else {
          tooltip.style.display = 'none';
        }
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
