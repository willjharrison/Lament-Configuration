<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Lament Configuration — Cross-Modal Manifold</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #050507;
      font-family: "Courier New", Courier, monospace;
      color: #d4af37;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    /* HUD Panel */
    #hud {
      position: absolute;
      top: 24px;
      left: 24px;
      pointer-events: none;
      background: rgba(10, 8, 12, 0.85);
      border: 1px solid #b8860b;
      box-shadow: 0 0 15px rgba(184, 134, 11, 0.2);
      padding: 16px;
      border-radius: 2px;
      max-width: 320px;
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #f3e5ab;
      border-bottom: 1px solid rgba(184, 134, 11, 0.4);
      padding-bottom: 6px;
    }
    p {
      margin: 6px 0 0 0;
      font-size: 0.75rem;
      color: #a89f91;
      line-height: 1.4;
    }
    /* Tooltip / Mechanism Card */
    #tooltip {
      position: absolute;
      display: none;
      pointer-events: none;
      background: rgba(8, 6, 10, 0.92);
      border: 1px solid #d4af37;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
      padding: 12px;
      border-radius: 2px;
      max-width: 280px;
    }
    #tooltip img {
      width: 100%;
      height: auto;
      border: 1px solid rgba(212, 175, 55, 0.5);
      margin-bottom: 8px;
      display: block;
      filter: sepia(0.2) contrast(1.1);
    }
    #tooltip .meta {
      font-size: 0.7rem;
      color: #d4af37;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    #tooltip .caption {
      font-size: 0.75rem;
      color: #cccccc;
      line-height: 1.35;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* Controls Overlay */
    #controls-guide {
      position: absolute;
      bottom: 24px;
      left: 24px;
      font-size: 0.7rem;
      color: #776e62;
      pointer-events: none;
    }
  </style>
  <!-- Three.js and OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="hud">
    <h1>Lament Configuration</h1>
    <p>Manifold Architecture: Visual Statistics ⟷ IMDB Semantic Geometry</p>
  </div>

  <div id="tooltip">
    <img id="tt-img" src="" alt="Frame Cut" />
    <div id="tt-meta" class="meta"></div>
    <div id="tt-caption" class="caption"></div>
  </div>

  <div id="controls-guide">
    [DRAG] Rotate Alignment Space | [SCROLL] Zoom Manifold
  </div>

  <script>
    let scene, camera, renderer, controls;
    let pointCloud, raycaster, mouse;
    let pointsData = [];
    
    const tooltip = document.getElementById('tooltip');
    const ttImg = document.getElementById('tt-img');
    const ttMeta = document.getElementById('tt-meta');
    const ttCaption = document.getElementById('tt-caption');

    init();

    function init() {
      // 1. World Setup
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x050507, 0.012);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 55);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.04;

      raycaster = new THREE.Raycaster();
      raycaster.params.Points.threshold = 0.9;
      mouse = new THREE.Vector2(-100, -100);

      // Add brass ambient light & grid mechanism
      const ambientLight = new THREE.AmbientLight(0xd4af37, 0.5);
      scene.add(ambientLight);

      const gridHelper = new THREE.GridHelper(100, 40, 0xb8860b, 0x221a0f);
      gridHelper.position.y = -25;
      scene.add(gridHelper);

      // 2. Load Manifold Data
      fetch('./rosetta_manifold_data.json')
        .then(res => {
          if (!res.ok) throw new Error(`HTTP error! Status: ${res.status}`);
          return res.json();
        })
        .then(data => {
          console.log("Raw JSON structure loaded:", data);
          buildLamentManifold(data);
        })
        .catch(err => console.error("Error unspooling manifold geometry:", err));

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('mousemove', onMouseMove);

      animate();
    }

    function extractPointsArray(rawData) {
      if (Array.isArray(rawData)) return rawData;
      if (!rawData || typeof rawData !== 'object') return [];

      // Check if scenes are nested directly inside movie entries
      if (Array.isArray(rawData.movies)) {
        let allScenes = [];
        rawData.movies.forEach(movie => {
          const scenes = movie.scenes || movie.frames || movie.trajectory || movie.points || [];
          if (Array.isArray(scenes) && scenes.length > 0) {
            scenes.forEach(sc => {
              allScenes.push({
                ...sc,
                movie_title: movie.title || movie.name || 'Unknown Movie'
              });
            });
          }
        });

        if (allScenes.length > 0) return allScenes;
      }

      // Check top-level array keys
      const candidateKeys = ['scenes', 'points', 'nodes', 'data', 'features', 'samples', 'vectors', 'manifold', 'movies'];
      for (const key of candidateKeys) {
        if (Array.isArray(rawData[key])) return rawData[key];
      }

      for (const key in rawData) {
        if (Array.isArray(rawData[key])) return rawData[key];
      }

      return [];
    }

    function extractCoordinates(item) {
      if (!item) return [0, 0, 0];
      
      if (Array.isArray(item) && item.length >= 3) return item.slice(0, 3);
      
      // Known coordinate key variations
      const coords = item.coords_3d || item.coords || item.centroid_3d || item.centroid || item.position || item.vector || item.xyz;
      if (Array.isArray(coords) && coords.length >= 3) return coords;

      if ('x' in item && 'y' in item && 'z' in item) {
        return [item.x, item.y, item.z];
      }

      return [0, 0, 0];
    }

    function buildLamentManifold(data) {
      pointsData = extractPointsArray(data);
      const count = pointsData.length;

      if (count === 0) {
        console.warn("Could not find manifold data points in rosetta_manifold_data.json.");
        return;
      }

      console.log(`Parsed ${count} manifold nodes.`);
      if (count > 0) console.log("Sample extracted node:", pointsData[0]);

      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);

      const baseGold = new THREE.Color(0xd4af37);
      const darkBronze = new THREE.Color(0x8b5a2b);
      const highlightGold = new THREE.Color(0xffe893);

      pointsData.forEach((item, i) => {
        const [x, y, z] = extractCoordinates(item);
        
        positions[i * 3]     = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        const norm = Math.min(Math.max((x + 20) / 40, 0), 1);
        const nodeColor = baseGold.clone().lerp(norm > 0.5 ? highlightGold : darkBronze, Math.abs(norm - 0.5) * 2);

        colors[i * 3]     = nodeColor.r;
        colors[i * 3 + 1] = nodeColor.g;
        colors[i * 3 + 2] = nodeColor.b;
      });

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const pMaterial = new THREE.PointsMaterial({
        size: 1.3,
        vertexColors: true,
        transparent: true,
        opacity: 0.9,
        sizeAttenuation: true
      });

      pointCloud = new THREE.Points(geometry, pMaterial);
      scene.add(pointCloud);
    }

    function onMouseMove(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      tooltip.style.left = (event.clientX + 18) + 'px';
      tooltip.style.top = (event.clientY + 18) + 'px';
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      if (pointCloud && controls.state === -1) {
        pointCloud.rotation.y += 0.0005;
      }

      if (pointCloud) {
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(pointCloud);

        if (intersects.length > 0) {
          const idx = intersects[0].index;
          const node = pointsData[idx];

          if (node) {
            tooltip.style.display = 'block';
            ttImg.src = node.img_base64 || node.thumbnail || node.image || '';
            const title = node.movie_title || node.title || 'Scene Node';
            ttMeta.innerText = `${title} | Chamber: ${node.scene_id || node.id || idx}`;
            ttCaption.innerText = node.text_snippet || node.review_text || node.text || node.caption || 'No textual trace recorded.';
          }
        } else {
          tooltip.style.display = 'none';
        }
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
